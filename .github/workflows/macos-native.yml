name: Build native macOS app

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'ios/**'
      - 'scripts/build_mac.sh'
      - 'scripts/build_whisper_macos.sh'
      - 'scripts/generate_ios_project.py'
      - 'engine_cli.py'
      - 'pipeline.py'
      - 'model_download.py'
      - 'desktop_runtime.py'
      - 'requirements-build.txt'
      - 'tests/**'
      - '.github/workflows/macos-native.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - 'scripts/build_mac.sh'
      - 'scripts/build_whisper_macos.sh'
      - 'scripts/generate_ios_project.py'
      - 'engine_cli.py'
      - 'pipeline.py'
      - 'model_download.py'
      - 'desktop_runtime.py'
      - 'requirements-build.txt'
      - 'tests/**'
      - '.github/workflows/macos-native.yml'

permissions:
  contents: write

concurrency:
  group: macos-native-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    # Same image as the iOS build: Xcode 27.x with the macOS 26.4+ SDK (SpeechAnalyzer, Translation).
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          set -euo pipefail
          LCR_XCODE=$(for app in /Applications/Xcode*.app; do
            [ -L "$app" ] && continue
            info=$("$app/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null) || continue
            echo "$(echo "$info" | awk 'NR==1{print $2}') $app"
          done | sort -V | tail -1 | cut -d' ' -f2-)
          sudo xcode-select -s "$LCR_XCODE"
          xcodebuild -version
          echo "macOS SDK $(xcrun --sdk macosx --show-sdk-version), running on macOS $(sw_vers -productVersion) $(uname -m)"
      - name: Set up arm64 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Python tests (pipeline and engine contract)
        run: python3 -m unittest discover -s tests -v
      - name: Swift lesson core tests
        run: |
          python3 tests/make_fixture.py "$RUNNER_TEMP/contract.lcrlesson"
          LCR_TEST_FIXTURE="$RUNNER_TEMP/contract.lcrlesson" swift test --package-path ios
      - name: Build iPhone app with the shared sources
        # main and pull requests build the iPhone app in ios.yml; branch pushes check it here.
        if: startsWith(github.ref, 'refs/heads/claude/')
        run: |
          set -o pipefail
          xcodebuild -project ios/LCRepeater.xcodeproj -scheme LCRepeater -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/ios-check CODE_SIGNING_ALLOWED=NO build \
            | tail -20
      - name: Build native Mac app
        run: bash scripts/build_mac.sh
      - name: Upload app and checksum
        uses: actions/upload-artifact@v4
        with:
          name: LC-Repeater-macOS-native-arm64
          path: |
            dist/macos/*.zip
            dist/macos/*.zip.sha256
          if-no-files-found: error
      - name: Transcribe real speech with the bundled engine (small Whisper model)
        run: |
          set -euo pipefail
          APP="dist/macos/LC Repeater.app"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/ggml-tiny.bin" \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          check() {
            python3 - "$1" "$2" <<'PY'
          import json, sys
          events = [json.loads(line) for line in open(sys.argv[1], encoding='utf-8') if line.strip()]
          done = events[-1]
          assert done['event'] == 'done', events[-3:]
          lesson = json.load(open(done['lesson'], encoding='utf-8'))
          assert lesson['lang'] == sys.argv[2] and lesson['sentences'], lesson
          for s in lesson['sentences']:
              print('%6.2f-%6.2f  %s' % (s['start'], s['end'], s['en']))
          PY
          }
          say -o "$RUNNER_TEMP/en.aiff" "Would you like a window seat? Yes, please. The meeting starts at three."
          LCR_WHISPER_DTW=tiny "$APP/Contents/Helpers/lcr-engine" --model "$RUNNER_TEMP/ggml-tiny.bin" \
            transcribe "$RUNNER_TEMP/en.aiff" --lang en --work "$RUNNER_TEMP/work-en" > "$RUNNER_TEMP/en.jsonl"
          check "$RUNNER_TEMP/en.jsonl" en
          LCR_JA_VOICE=$(say -v '?' | awk '/ja_JP/ {print $1; exit}')
          if [ -n "$LCR_JA_VOICE" ]; then
            say -v "$LCR_JA_VOICE" -o "$RUNNER_TEMP/ja.aiff" "すみません、駅はどこですか。まっすぐ行ってください。"
            LCR_WHISPER_DTW=tiny "$APP/Contents/Helpers/lcr-engine" --model "$RUNNER_TEMP/ggml-tiny.bin" \
              transcribe "$RUNNER_TEMP/ja.aiff" --lang ja --work "$RUNNER_TEMP/work-ja" > "$RUNNER_TEMP/ja.jsonl"
            check "$RUNNER_TEMP/ja.jsonl" ja
          else
            echo "No Japanese voice on this runner; skipped the Japanese check."
          fi
      - name: Launch the app (smoke test)
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          report = os.path.join(os.environ['RUNNER_TEMP'], 'mac-smoke.json')
          app = 'dist/macos/LC Repeater.app/Contents/MacOS/LC Repeater'
          proc = subprocess.run([app, '--smoke-test', report], timeout=180,
                                stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          print(proc.stdout[-3000:])
          data = json.load(open(report))
          print(json.dumps(data, indent=1))
          assert data['engine_bundled'] and data.get('engine_whisper'), data
          PY
      - name: Publish macOS app to GitHub Releases
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP="dist/macos/LC Repeater.app"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")
          ZIP=$(ls dist/macos/*.zip)
          (cd dist/macos && shasum -a 256 -c "$(basename "$ZIP").sha256")
          NOTES="$RUNNER_TEMP/macos-release-notes.md"
          cat > "$NOTES" <<EOF
          LC Repeater 네이티브 macOS ${VERSION} (빌드 ${BUILD})

          - Apple Silicon, macOS 26 이상
          - 전사: Apple 기기 내 전사 또는 Whisper / 번역: Apple 기기 내 번역 또는 Claude (claude -p)
          - 서명하지 않은 앱입니다. 처음 열 때 차단되면 시스템 설정 → 개인정보 보호 및 보안에서 '그래도 열기'를 누르세요.
          - Source commit: $GITHUB_SHA
          - Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          gh release create "macos-v${VERSION}-build${BUILD}-${GITHUB_RUN_NUMBER}" "$ZIP" "$ZIP.sha256" \
            --target "$GITHUB_SHA" --title "macOS ${VERSION} (빌드 ${BUILD} · #${GITHUB_RUN_NUMBER})" \
            --notes-file "$NOTES"
